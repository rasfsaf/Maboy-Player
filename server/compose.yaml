services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: maboy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: maboy
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maboy"]
      interval: 5s
      retries: 10
  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://maboy:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db/maboy
      YOUTUBE_COOKIES_FILE: /run/secrets/youtube_cookies.txt
      YOUTUBE_CACHE_DIR: /var/lib/maboy/youtube
      YOUTUBE_CACHE_MAX_BYTES: ${YOUTUBE_CACHE_MAX_BYTES:-21474836480}
    volumes:
      - youtube_cache:/var/lib/maboy/youtube
      - ${YOUTUBE_COOKIES_HOST_PATH:-./secrets/youtube_cookies.txt}:/run/secrets/youtube_cookies.txt:ro
    ports:
      - "127.0.0.1:18181:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
  youtube_cache:
